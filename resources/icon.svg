<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="film" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="64" y="64" width="896" height="896" rx="196" ry="196" fill="url(#bg)"/>

  <!-- Film strip holes - left -->
  <rect x="172" y="200" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>
  <rect x="172" y="300" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>
  <rect x="172" y="400" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>
  <rect x="172" y="500" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>
  <rect x="172" y="600" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>
  <rect x="172" y="700" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>

  <!-- Film strip holes - right -->
  <rect x="804" y="200" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>
  <rect x="804" y="300" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>
  <rect x="804" y="400" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>
  <rect x="804" y="500" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>
  <rect x="804" y="600" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>
  <rect x="804" y="700" width="48" height="32" rx="6" fill="#e94560" opacity="0.9"/>

  <!-- Center play button circle -->
  <circle cx="512" cy="460" r="180" fill="none" stroke="#e94560" stroke-width="12" opacity="0.3"/>

  <!-- Play triangle -->
  <polygon points="448,360 448,560 608,460" fill="url(#accent)"/>

  <!-- "CA" text below -->
  <text x="512" y="740" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="8">CA</text>

  <!-- Subtle bottom line -->
  <rect x="400" y="770" width="224" height="4" rx="2" fill="#e94560" opacity="0.6"/>
</svg>
